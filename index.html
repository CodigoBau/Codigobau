<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodigoBAU</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #ffffff;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 1.1rem;
      font-weight: 300;
      line-height: 1.6;
      white-space: nowrap; /* ✅ Esto mantiene las frases en una sola línea */
    }

    .contenedor {
      padding: 0 2rem;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>CódigoBAU</h1>
    <p>Estamos construyendo nuestra tienda.</p>
    <p>Este espacio ya está tomando forma.</p>
  </div>
</body>
</html>
